# ┌──────────────────────────────────────────────────────────────────────────┐
# │ THIS FILE IS NOT THE SHIPPED PRODUCT RULE.                               │
# │                                                                          │
# │ `threshold: 0.65` + `vectorize_min_blob_px: 2000` below describe the      │
# │ SUPERSEDED first product — `south_rts.gpkg` (10,984 polygons /           │
# │ 238.08 km², delivered 2026-07-11, kept only for provenance).             │
# │                                                                          │
# │ The DELIVERED inventory is cut at threshold **0.30** with **no minimum   │
# │ mapping unit** (`vectorize_region.py --threshold 0.30 --min-area-m2 0`,   │
# │ 60,167 polygons / 688.2 km²). Size acceptance is the QC-calibrated        │
# │ adaptive `rts_class` rule, not a fixed floor.                             │
# │                                                                          │
# │ Do not quote any number in this file as the mapping method. The product   │
# │ SSoT is `post-inference/south_products.md` §"Size parameters — which      │
# │ number is which", which also disambiguates the four size parameters that  │
# │ share the name "min_blob" / "MMU".                                        │
# └──────────────────────────────────────────────────────────────────────────┘
#
# Deployment config — shared by calibration (training.md §12) and inference
# (inference.md §8.2). Single source of truth for everything that must match
# between the two (training.md §4.6):
#
#   threshold + temperature  — learned in calibration on val, written back here.
#   precision                — must match training (bf16 on A100/H100 baseline).
#   torch_compile            — opt-in; if enabled, calibration must be re-run.
#   tta                      — validated in Step 8.5b; default none.
#   scales + fusion          — validated in Step 8.5a; default single-scale.
#
# evaluate_test.py refuses to run if threshold or temperature is null
# (plan Step 8: "calibrate on val first, then test").

# Binary decision threshold on the temperature-scaled ensemble probability.
# OBJECT-tuned, not pixel-tuned (scripts/tune_object_operating_point.py on
# Val-Realistic, 2026-06-25): the pixel-precision calibrate.py threshold (0.1224)
# is the wrong operating point for an object-detection product — it spews speckle
# FPs (obj-F1 0.30, 443 FP objects). PRECISION-LEANING choice (user, 2026-06-25):
# thr 0.65 + min_blob 80 px (morph off) → the object-precision MAXIMUM of the grid,
# obj-P 0.611 / obj-R 0.439 (obj-F1 0.511), pixel-P 0.987 — beyond 0.65 both
# obj-P and obj-R fall. A pan-Arctic survey map favouring few false slumps over
# completeness, per the project's precision-over-recall priority.
# (obj-F1-argmax alternative was thr 0.30: obj-F1 0.567, obj-P 0.489/obj-R 0.674.
#  Pixel-calibrated value for reference: 0.122401.)
# NB (2026-08-12): the value below is the 2026-06-25 operating point and is the
# threshold of the SUPERSEDED product. The shipped inventory is cut at 0.30 —
# the obj-F1-argmax alternative named above. See the banner at the top.
threshold: 0.65

# Temperature scaling parameter learned on val (training.md §12.1).
# probability = sigmoid(logit / temperature). Calibrated for the fused ensemble.
temperature: 0.512321

# 3-seed deployment ensemble (Phase D decision 2026-06-25 — robustness over a
# single lucky/unlucky seed, not the marginal +0.0091 PR-AUC). Fusion recipe
# (must match scripts/calibrate.py): per seed sigmoid(logit) at T=1, arithmetic
# mean across seeds, then the temperature+threshold above applied to the fused
# prob. Val-Realistic: PR-AUC-geomean 0.9393.
ensemble:
  fusion: mean_prob
  members:
    - aug_trivialaugment_deploy          # seed42
    - aug_trivialaugment_deploy_seed43   # seed43
    - aug_trivialaugment_deploy_seed44   # seed44

# Must match the training run's effective precision. See training.md §4.6.
precision: "bf16"           # bf16 | fp16 | fp32

# torch.compile() on the model at inference time. Changes numerics slightly;
# keep false unless Step 8.5 re-runs calibration with compile enabled.
torch_compile: false

# Test-time augmentation. Start at "none"; Step 8.5b upgrades if gain > 1%
# PR-AUC AND precision@threshold drops <= 0.5%.
tta: "none"                 # none | minimal | standard | full

# Inference scale pyramid. Step 8.5a promotes to [1.0, 0.5] only if large-RTS
# PR-AUC gain >= 2% AND global FP-rate delta <= 10%.
scales: [1.0]

# Cross-scale fusion method (only used when len(scales) > 1).
fusion: "weighted_mean"     # weighted_mean | max | consensus

# SUPERSEDED — legacy product only. Vectorization-stage minimum blob size, in
# EPSG:3857 PIXELS (not m²). Renamed from `min_blob_size_px` on 2026-08-12;
# utils.config.vectorize_min_blob_px still reads the old name from packages
# already on GCS.
#
# WHY THE RENAME — this one key held three different values over time, and all
# three are quoted somewhere as "the deployment min_blob":
#   10   (e630266, 2026-05-04)  — matched the eval-stage default
#   80   (db38892, 2026-06-25)  — LIVE WHEN THE LEDGER-J ONE-SHOT RAN, which is
#                                 why J's obj-P 0.584 is a "min_blob 80" number
#   2000 (757825a, 2026-06-26)  — the value below
# It is also distinct from `metrics.min_blob_size_px: 10` in the training
# configs (an eval-only filter) and from the shipped geodesic `--min-area-m2`
# MMU (m², latitude-constant). Four parameters, confusable names:
# post-inference/south_products.md §"Size parameters — which number is which".
#
# FIRST PRODUCT (user choice 2026-06-26, precision-leaning): thr 0.65 +
# min_blob 2000 px → Val obj-P 0.79 / obj-R 0.35. NOT the result of a sweep —
# the tuning grid (tune_object_operating_point.py) topped out at 80 px, so this
# is 25x the largest value ever swept, evaluated only by post-hoc recompute.
# Being a pixel count, its ground floor slides ~7x with latitude: 18,857 m² at
# 50°N → 4,533 m² at 71.63°N (inventory median) → 2,671 m² at 76°N.
#
# A VECTORIZATION-stage param — it does NOT affect the probability COGs the
# inference pass writes, so other products (other thr/min_blob) can be cut from
# the same probabilities later; that is exactly how the shipped 0.30 / no-MMU
# inventory was produced from these same probabilities.
vectorize_min_blob_px: 2000

# Inference-time runtime values. Single source of truth; specs reference these
# keys instead of restating numbers (inference.md §4.1, §4.2, §4.3, §8.1).
inference:
  stride_px: 344            # tile-grid stride; 33% overlap at 512 tile size (inference.md §4.2)
  fusion_sigma_px: 128      # σ for distance-from-center weighted-mean fusion (inference.md §4.3)
  batch_size: 64            # per-GPU batch at inference (inference.md §8.1)
  # Probability-COG output encoding (§9.1). scaled_uint8 = prob×250 uint8 /
  # NoData 255 (~8 KB/tile, 0.004 precision, ~0.3 TB full run); float32 = exact
  # / NoData -1.0 (~570 KB/tile, ~24 TB). Not a calibration key (not §14-checked);
  # merge_predictions decodes either via writer.read_probability_tile.
  output_dtype: scaled_uint8   # scaled_uint8 | float32
  write_threads: 16            # async prob-COG writer pool (runner._ProbWriter); the 2.8→33 t/s fix
  stall_timeout_s: 900         # runner._start_stall_watchdog: os._exit the worker after this many
  #                              seconds with no tile progress so a wedged DataLoader releases its
  #                              shard (defence behind the forkserver fix); the supervisor restarts it.
