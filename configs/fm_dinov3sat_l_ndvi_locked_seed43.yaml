# Family E: sat-DINOv3 ViT-L (SAT-493M) + NDVI on the FULL LOCKED v2 RECIPE — the FAIR encoder test.
# The earlier fm_dinov3sat_l_ndvi runs inherited phase0c (boundary none + RandomScale on + hand-tuned
# color), so they were NOT comparable to the EffB5 deploy (ignore_w2 + drop-RandomScale + TrivialAugment)
# AND were scored on different val labels (boundary_handling touches val). This config adds the three
# locked recipe components so the sat-vs-EffB5 comparison is apples-to-apples on identical val labels.
# Encoder + LLRD/freeze schedule kept (encoder-appropriate, gate-neutral). Gate vs EffB5 recipe 0.9218.
base: phase0c_seed42.yaml
seed: 43
data:
  data_root: /outputs/v1.0/data_local
  normalization_stats_path: /outputs/v1.0/staging/v1_splits/normalization_stats_dinov3sat_ndvi.json
channels:
  rgb: true
  extra:
    - {name: ndvi, band: 0}
model:
  architecture: foundation
  backbone: vit_large_patch16_dinov3.sat493m
  pretrained: true
training:
  early_stopping:
      start_epoch: 70
  batch_size: 16
optimizer:
  weight_decay: 5.0e-2
lr_schedule:
  frozen_lr: 1.0e-3
  base_lr: 2.0e-4
  backbone_lr_multiplier: 1.0
  llrd_decay: 0.75
  freeze_backbone_epochs: 20
  warmup_epochs: 5
  warmup_start_lr: 1.0e-6
  min_lr: 1.0e-6
  backbone_warmup_epochs: 5
# --- locked v2 recipe deltas (the fairness fix) ---
loss:
  boundary_handling: ignore
  boundary_ignore_width: 2
augmentation:
  multi_scale: {p: 0.0}
  auto_policy: {mode: trivialaugment, magnitude: 1.0}
mlflow:
  run_name: fm_dinov3sat_l_ndvi_locked_seed43
