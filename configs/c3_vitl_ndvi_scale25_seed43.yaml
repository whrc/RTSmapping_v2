# C3 capacity x data-budget: sat-DINOv3 ViT-L +NDVI, locked recipe, 25% positive subset, seed 43. 100% = fm_dinov3sat_l_ndvi_locked*.
base: phase0c_seed42.yaml
seed: 43
data:
  data_root: /outputs/v1.0/data_local
  normalization_stats_path: /outputs/v1.0/staging/v1_splits/normalization_stats_dinov3sat_ndvi.json
channels:
  rgb: true
  extra: 
    - {name: ndvi, band: 0}
model:
  architecture: foundation
  backbone: vit_large_patch16_dinov3.sat493m
  pretrained: true
training:
  early_stopping:
      start_epoch: 45
  batch_size: 16
optimizer:
  weight_decay: 5.0e-2
lr_schedule:
  frozen_lr: 1.0e-3
  base_lr: 2.0e-4
  backbone_lr_multiplier: 1.0
  llrd_decay: 0.75
  freeze_backbone_epochs: 20
  warmup_epochs: 5
  warmup_start_lr: 1.0e-6
  min_lr: 1.0e-6
  backbone_warmup_epochs: 5
loss:
  boundary_handling: ignore
  boundary_ignore_width: 2
augmentation:
  multi_scale: {p: 0.0}
  auto_policy: {mode: trivialaugment, magnitude: 1.0}
splits:
  train_positive_subset_pct: 25
mlflow:
  run_name: c3_vitl_ndvi_scale25_seed43
