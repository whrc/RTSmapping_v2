# Family E: DINOv3 sat-7B frozen — honest re-tune, variant B.
# Same fix as variant A but with a longer decoder phase-1 (matching the sat-ViT-L
# freeze_backbone_epochs=20 window) in case the shorter 10-epoch warm start in variant A is
# still too abrupt for this much larger frozen encoder's feature statistics.
# LR range test (fm_dinov3sat_7b_lrtest, lr_range_test.csv): loss stays clean/low up to ~2e-4,
# explodes sharply from ~4e-4 (loss 93.7 at lr=4.13e-4). base_lr=2e-4 (unchanged) sits right at
# the edge of the safe zone; frozen_lr is lowered from the original 1e-3 (well past the
# explosion point) to 1e-4 (solidly clean) since it's now only used briefly during phase 1.
# NOTE: base configs may not chain, so fm_dinov3sat_7b_frozen.yaml's deltas are inlined here
# directly on top of base_v2_fast.yaml rather than via base:.
base: base_v2_fast.yaml
data:
  data_root: /outputs/v1.0/data_local
  normalization_stats_path: /outputs/v1.0/staging/v1_splits/normalization_stats_dinov3sat.json
channels:
  rgb: true
  extra: []
model:
  architecture: foundation
  backbone: vit_7b_patch16_dinov3.sat493m
  pretrained: true
training:
  batch_size: 4
optimizer:
  weight_decay: 5.0e-2
lr_schedule:
  frozen_lr: 1.0e-4
  base_lr: 2.0e-4
  backbone_lr_multiplier: 1.0
  llrd_decay: null
  freeze_backbone_epochs: 999
  decoder_phase2_start_epoch: 20
  warmup_epochs: 5
  warmup_start_lr: 1.0e-6
  min_lr: 1.0e-6
  backbone_warmup_epochs: 5
mlflow:
  run_name: fm_dinov3sat_7b_tuned_b
