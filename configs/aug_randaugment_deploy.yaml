# Augmentation family (F): RandAugment screen on the locked v2 deploy recipe.
# Replaces the hand-tuned color stage with RandAugment (num_ops random shadow-safe photometric
# ops per image at fixed magnitude) over the same shadow-cue-preserving pool as TrivialAugment.
# Single-seed screen vs the deploy 3-seed mean 0.9123; lock only if mean Δ≥G AND sign-consistent
# + precision guard.
base: base_v2_fast.yaml
seed: 42
data:
  data_root: /outputs/v1.0/data_local
  normalization_stats_path: /outputs/v1.0/staging/v1_splits/normalization_stats_ndvi.json
channels:
  rgb: true
  extra:
    - {name: ndvi, band: 0}
loss:
  boundary_handling: ignore
  boundary_ignore_width: 2
augmentation:
  multi_scale: {p: 0.0}
  auto_policy:
    mode: randaugment
    num_ops: 2
    magnitude: 0.5
mlflow:
  run_name: aug_randaugment_deploy
