# Family E: DINOv3 satellite ViT-7B, frozen — decoder LR range test.
# The original fm_dinov3sat_7b_frozen run (0.4747, killed) was not a capacity failure: the
# scheduler pinned the decoder at a flat, un-annealed frozen_lr=1e-3 for the whole 120-epoch
# run (freeze_backbone_epochs=999 also silenced the decoder's own warmup/cosine — see
# training/scheduler.py's decoder_phase2_start_epoch fix), and it collapsed once the
# curriculum hardened at epoch 11. Before re-tuning, range-test the decoder LR ceiling on this
# encoder/batch-size (4, memory-constrained) the same way Phase 0 §3.2 did for EffB5.
# Output: lr_range_test.csv (MLflow artifact) — pick the LR order of magnitude with steepest
# stable descent before divergence; that informs base_lr in fm_dinov3sat_7b_tuned_*.yaml.
# NOTE: base configs may not chain (loader rejects it), so fm_dinov3sat_7b_frozen.yaml's
# deltas are inlined here directly on top of base_v2_fast.yaml rather than via base:.
base: base_v2_fast.yaml
data:
  data_root: /outputs/v1.0/data_local
  normalization_stats_path: /outputs/v1.0/staging/v1_splits/normalization_stats_dinov3sat.json
channels:
  rgb: true
  extra: []
model:
  architecture: foundation
  backbone: vit_7b_patch16_dinov3.sat493m
  pretrained: true
training:
  batch_size: 4
  max_epochs: 1
  val_frequency: 999
  early_stopping:
    patience: 999
    min_delta: 0.0
    start_epoch: 999
    metric: val_realistic_pr_auc_geomean
    smoothing_window: 3
optimizer:
  weight_decay: 5.0e-2
  gradient_clip_norm: 100.0
lr_schedule:
  scheduler: lr_range_test
  lr_range_min: 1.0e-7
  lr_range_max: 1.0e-1
  # Unused under lr_range_test but required keys for a well-formed cfg:
  frozen_lr: 1.0e-3
  base_lr: 2.0e-4
  backbone_lr_multiplier: 1.0
  llrd_decay: null
  freeze_backbone_epochs: 999
  warmup_epochs: 5
  warmup_start_lr: 1.0e-6
  min_lr: 1.0e-6
  backbone_warmup_epochs: 5
ema:
  enabled: false
mlflow:
  run_name: fm_dinov3sat_7b_lrtest
