# Phase 4 EXTRA channel ablation (experiments.md §7). Full stack: all 8 EXTRA bands (§7.3 ceiling).
# Inherits the loss-locked v1.0 baseline (focal); differs ONLY in channels.extra.
# Corrected leakage-free split (data_local/splits.yaml) + 8-band EXTRA norm stats,
# so EXTRA vs RGB is measured on one internally-consistent split. Boundary held at
# baseline (none) pending the Phase-3 boundary factorial lock.
base: phase0c_seed42.yaml
data:
  data_root: /outputs/v1.0/data_local
  normalization_stats_path: /outputs/v1.0/staging/v1_splits/normalization_stats.json
channels:
  rgb: true
  extra:
    - {name: ndvi,     band: 0}
    - {name: nbr,      band: 1}
    - {name: se_pca_1, band: 2}
    - {name: se_pca_2, band: 3}
    - {name: se_pca_3, band: 4}
    - {name: se_proto, band: 5}
    - {name: tc_1,     band: 6}
    - {name: tc_2,     band: 7}
mlflow:
  run_name: phase4_extra_full
