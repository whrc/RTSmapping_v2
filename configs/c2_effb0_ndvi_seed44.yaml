# C2 same-family capacity sweep: EfficientNet-b0 on the effb3_deploy recipe
# (NDVI, ignore_w2, RandomScale off, NO TrivialAugment), varying ONLY model.backbone. Seed 44.
# Sweep points: B0(new) / B3=effb3_deploy / B5=deploy_v1_ndvi_seed4* / B7(new).
base: base_v2_fast.yaml
seed: 44
data:
  data_root: /outputs/v1.0/data_local
  normalization_stats_path: /outputs/v1.0/staging/v1_splits/normalization_stats_ndvi.json
channels:
  rgb: true
  extra:
    - {name: ndvi, band: 0}
loss:
  boundary_handling: ignore
  boundary_ignore_width: 2
augmentation:
  multi_scale: {p: 0.0}
model:
  backbone: efficientnet-b0
mlflow:
  run_name: c2_effb0_ndvi_seed44
