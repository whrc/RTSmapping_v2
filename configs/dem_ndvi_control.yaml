# ArcticDEM revisit — family D-DEM. The deployed recipe (RGB+NDVI) re-measured on the
# ArcticDEM-covered subset, so it is a like-for-like comparator for dem_ndvi_terrain.
# Differs from aug_trivialaugment_deploy ONLY in splits.tile_allowlist + stats file.
# Reads canonical EXTRA band 0; EXTRA_DEM band 0 is a verbatim copy of it.
base: base_v2_fast.yaml
seed: 42
data:
  data_root: /outputs/v1.0/data_local
  normalization_stats_path: /outputs/v1.0/staging/v1_splits/normalization_stats_arcticdem_ndvi.json
splits:
  tile_allowlist: arcticdem_covered_tiles.txt
channels:
  rgb: true
  extra:
    - {name: ndvi, band: 0}
loss:
  boundary_handling: ignore
  boundary_ignore_width: 2
augmentation:
  multi_scale: {p: 0.0}
  auto_policy: {mode: trivialaugment, magnitude: 1.0}
mlflow:
  run_name: dem_ndvi_control
