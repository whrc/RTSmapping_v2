# ArcticDEM revisit — family D-DEM. RGB + NDVI + 4 ArcticDEM terrain bands (8-ch).
# The deployment question: does terrain add anything on top of what we ship?
# Compare against dem_ndvi_control (same recipe, same tiles, NDVI only).
#
# NDVI is band 0 of the EXTRA_DEM sidecar, copied verbatim from canonical EXTRA, so
# its values are bit-identical to dem_ndvi_control's. Stats are the superset file
# every other D-DEM arm is sliced from, so shared channels share constants exactly.
base: base_v2_fast.yaml
seed: 42
data:
  data_root: /outputs/v1.0/data_local
  extra_dir: EXTRA_DEM
  normalization_stats_path: /outputs/v1.0/staging/v1_splits/normalization_stats_arcticdem_super.json
splits:
  tile_allowlist: arcticdem_covered_tiles.txt
channels:
  rgb: true
  extra:
    - {name: ndvi,      band: 0}
    - {name: dem_relev, band: 8}
    - {name: dem_slope, band: 9}
    - {name: dem_tpi,   band: 10}
    - {name: dem_curv,  band: 11}
loss:
  boundary_handling: ignore
  boundary_ignore_width: 2
augmentation:
  multi_scale: {p: 0.0}
  auto_policy: {mode: trivialaugment, magnitude: 1.0}
mlflow:
  run_name: dem_ndvi_terrain
