# cgm screen (docs/cgm.md), seed 42, avg pooling: the M1.0 recipe on D1.0
# (= configs/aug_trivialaugment_deploy.yaml) plus the tile existence gate. The ONLY delta from
# its control (aug_trivialaugment_deploy, seed 42) is model.cgm. To test cgm on another data
# version, copy that version's control config and add the same model.cgm block.
base: base_v2_fast.yaml
seed: 42
data:
  data_root: /outputs/v1.0/data_local
  normalization_stats_path: /outputs/v1.0/staging/v1_splits/normalization_stats_ndvi.json
channels:
  rgb: true
  extra:
    - {name: ndvi, band: 0}
loss:
  boundary_handling: ignore
  boundary_ignore_width: 2
augmentation:
  multi_scale: {p: 0.0}
  auto_policy:
    mode: trivialaugment
    magnitude: 1.0
model:
  cgm:
    pooling: avg       # pool over the deepest encoder features (max | avg)
    dropout: 0.2
    init_bias: 3.0       # gate starts at sigmoid(3) = 0.95, i.e. nearly open
    loss_weight: 0.1     # lambda on the tile BCE (focal is ~0.005-0.05; see docs/cgm.md)
    min_pos_px: 50       # tile positive at >= 50 RTS px, negative at 0, dropped in between
mlflow:
  run_name: cgm_avg_seed42
