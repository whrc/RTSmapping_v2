# Family E: DINOv3 SATELLITE ViT-L (SAT-493M) + NDVI — the deployment-relevant foundation test.
# Motivated: web DINOv3+NDVI tied EffB5+NDVI (~0.912) — the foundation edge vanishes once NDVI
# is added — so the satellite-domain encoder is the remaining bet. Gate vs EffB5+NDVI 0.9123
# and web-DINOv3+NDVI ~0.912. RGB+NDVI early fusion via the ViT patch-embed expansion
# (in_channels=4, zero-init EXTRA — same path as the web phase4_fm_dinov3_ndvi run).
# Norm: native SAT-493M RGB + per-dataset NDVI (the model has no native NDVI prior).
base: phase0c_seed42.yaml
data:
  data_root: /outputs/v1.0/data_local
  normalization_stats_path: /outputs/v1.0/staging/v1_splits/normalization_stats_dinov3sat_ndvi.json
channels:
  rgb: true
  extra:
    - {name: ndvi, band: 0}
model:
  architecture: foundation
  backbone: vit_large_patch16_dinov3.sat493m
  pretrained: true
training:
  early_stopping:
      start_epoch: 70
  batch_size: 16
optimizer:
  weight_decay: 5.0e-2
lr_schedule:
  frozen_lr: 1.0e-3
  base_lr: 2.0e-4
  backbone_lr_multiplier: 1.0
  llrd_decay: 0.75
  freeze_backbone_epochs: 20
  warmup_epochs: 5
  warmup_start_lr: 1.0e-6
  min_lr: 1.0e-6
  backbone_warmup_epochs: 5
mlflow:
  run_name: fm_dinov3sat_l_ndvi
