# pos-pixel-fraction band the spec prefers) — refine in pass-2 if needed.
#
# Edit freely to swap in any val UIDs you find more diagnostic. Tiles not present
# in a given run's val split are skipped with a warning; if none match, the run
# falls back to the seeded pass-1 heuristic.
