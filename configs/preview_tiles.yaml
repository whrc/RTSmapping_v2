# Explicit tile UIDs (the .tif filenames in PLANET-RGB) drawn from the v1.0
# val_realistic split (1,495 tiles: 267 pos / 1,228 neg). Pinning these means
# every experiment and every seed renders the SAME tiles, so preview grids are
# directly comparable across runs (fix the input, vary the model).
#
# Regenerated 2026-06-14 from the v1.0 split via
# training/visualizations.py:pick_preview_tiles_pass1 (seed 42, 3 pos + 3 neg).
# The previous set pointed at the DESTROYED v2-alpha split, so stale UIDs were
# silently skipped → only 2 negatives rendered.
#
# Selection: negatives = 25-75th pctile of distance-to-nearest-positive centroid
