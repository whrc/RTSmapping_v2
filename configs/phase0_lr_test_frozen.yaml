# Phase 0 — LR range test, frozen-phase (training/experiments.md §3.2).
#
# Run on a 30 % positive-tile subset for ~1 epoch with the backbone frozen.
# A custom one-shot LR scheduler ramps LR from 1e-7 to 1e-1 across the epoch.
# Output: the order of magnitude where the loss curve has the steepest stable
# descent before divergence — that value lands in `lr_schedule.frozen_lr` for
# subsequent runs.
#
# Diff from baseline.yaml:
#   - splits.train_positive_subset_pct: 30          (Phase 2-style subset; TBD impl)
#   - training.max_epochs: 1                        (single-epoch test)
#   - training.early_stopping.start_epoch: 9999     (effectively disabled for the test)
#   - lr_schedule.scheduler: "lr_range_test"        (TBD impl: 1e-7 → 1e-1 linear ramp)
#   - lr_schedule.lr_range_min: 1.0e-7              (TBD impl)
#   - lr_schedule.lr_range_max: 1.0e-1              (TBD impl)
#   - lr_schedule.freeze_backbone_epochs: 9999      (backbone stays frozen for the test)
#   - mlflow.run_name: "phase0_lr_test_frozen"
#
# **TBD impl**: scripts/lr_range_test.py (or a new scheduler in
# training/scheduler.py keyed by `lr_schedule.scheduler == "lr_range_test"`).
# This config records the intent; the runner does not exist yet.

seed: 42
deterministic: false

data:
  version: "2.0"
  data_root: "gs://abruptthawmapping/training/v2.0"
  rgb_dir: "PLANET-RGB"
  extra_dir: "EXTRA"
  labels_dir: "labels"
  metadata_csv: "metadata.csv"
  splits_yaml: "splits.yaml"
  splits_summary_json: "splits_summary.json"
  tile_size: 512
  crs: "EPSG:3857"
  label_ignore_index: 255
  normalization_stats_path: "gs://abruptthawmapping/training/v2.0/normalization_stats.json"

channels:
  rgb: true
  extra: []

splits:
  regions_geojson: "domain/circumpolar_subregions.geojson"
  train_fraction: 0.80
  val_fraction: 0.10
  test_fraction: 0.10
  min_test_positives: 100
  min_val_ecoregions: 2
  min_train_positive_fraction: 0.70
  max_drift: 0.10
  train_positive_subset_pct: 30   # TBD impl per data/data.md §3.3 + experiments.md §5.2

normalization:
  rgb_clip_percentiles: [0.1, 99.9]
  extra_clip_percentiles: [0.1, 99.9]

sampling:
  balanced: true
  positive_fraction: 0.5
  curriculum_schedule:
    "1-1": 1   # collapsed to a single ratio for the one-epoch test

augmentation:
  geometric:
    rot90_p: 0.5
    hflip_p: 0.5
    vflip_p: 0.5
    shift_scale_rotate: {shift: 0.1, scale: 0.2, rotate: 45, p: 0.5}
    elastic: {alpha: 120, sigma: 6, p: 0.3}
    shear: {shear_degrees: 10, p: 0.3}
  color:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    brightness_contrast_p: 0.5
    gaussian_noise: {var_limit: [10, 50], p: 0.3}
    clahe: {clip_limit: 4.0, tile_grid: [8, 8], p: 0.2}
  multi_scale:
    scale_range: [0.5, 1.0]
    p: 0.3

loss:
  function: "focal"
  focal_gamma: 2.0
  focal_alpha: 0.25
  lambda_focal: 1.0
  lambda_dice: 1.0
  tversky_alpha: 0.3
  tversky_beta: 0.7
  tversky_eps: 1.0
  dice_eps: 1.0
  boundary_handling: "none"
  boundary_ignore_width: 3
  soft_label_value: 0.05

training:
  batch_size: 32
  max_epochs: 1
  val_frequency: 9999
  early_stopping:
    patience: 8
    min_delta: 0.005
    start_epoch: 9999       # disabled for the LR test
    metric: "val_realistic_pr_auc_geomean"
    smoothing_window: 3
  precision: "bf16"
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: true
  drop_last: true
  gcsfuse:
    file_cache_capacity_mb: 20480
    stat_cache_ttl: "24h"
    type_cache_ttl: "24h"
    file_cache_cache_file_for_range_read: true
    metadata_prefetch_on_mount: "async"

optimizer:
  name: "adamw"
  weight_decay: 1.0e-2
  gradient_clip_norm: 1.0

lr_schedule:
  scheduler: "lr_range_test"   # TBD impl
  lr_range_min: 1.0e-7
  lr_range_max: 1.0e-1
  frozen_lr: 1.0e-3            # ignored under lr_range_test scheduler
  base_lr: 1.0e-4
  backbone_lr_multiplier: 0.1
  freeze_backbone_epochs: 9999  # backbone stays frozen for the entire test
  warmup_epochs: 0
  warmup_start_lr: 1.0e-7
  min_lr: 1.0e-7
  backbone_warmup_epochs: 0

ema:
  enabled: true
  decay: 0.999

model:
  architecture: "unetplusplus"
  backbone: "efficientnet-b5"
  pretrained: true
  output_bias_prior: 0.5

metrics:
  min_blob_size_px: 10
  object_iou_threshold: 0.3
  reporting_threshold: 0.5
  preview_tile_config: "configs/preview_tiles.yaml"

mlflow:
  tracking_uri: "gs://abruptthawmapping/abrupt_thaw/RTS_MODEL_V2/mlflow_tracking"
  experiment_name: "rts-segmentation-v2"
  run_name: "phase0_lr_test_frozen"
