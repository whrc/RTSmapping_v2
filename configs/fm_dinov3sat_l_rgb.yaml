# Family E: DINOv3 **satellite** encoder (ViT-L/16 distilled from the SAT-493M ViT-7B), RGB-only.
# Tests whether a satellite-domain foundation encoder beats the web-pretrained DINOv3 (ViT-B RGB
# 0.873) and our EffB5+NDVI 0.9123. Near drop-in for the ViT FoundationSegmenter path
# (forward_intermediates; has .blocks → LLRD works), same LP-FT recipe as phase4_fm_dinov3_rgb.
#
# NORMALIZATION (the key difference): uses DINOv3's **native SAT-493M** RGB stats
# (mean (0.430,0.411,0.296)/std (0.213,0.156,0.143) → raw-uint8 scale in the json), NOT the
# per-dataset z-score the web DINOv3 runs used. A satellite-pretrained encoder must see its
# native normalization. (Confound noted in the ledger: the web DINOv3 head-to-head used a
# different norm, so sat-vs-web is directional.)
# Batch reduced 32→16 (ViT-L at 512² is ~3.5× the web ViT-B); LR from the web DINOv3 stable zone.
base: base_v2_fast.yaml
data:
  data_root: /outputs/v1.0/data_local
  normalization_stats_path: /outputs/v1.0/staging/v1_splits/normalization_stats_dinov3sat.json
channels:
  rgb: true
  extra: []
model:
  architecture: foundation
  backbone: vit_large_patch16_dinov3.sat493m
  pretrained: true
training:
  early_stopping:
      start_epoch: 70          # give the larger ViT time to converge post-unfreeze (cf. dinov3_ndvi)
  batch_size: 16
optimizer:
  weight_decay: 5.0e-2
lr_schedule:
  frozen_lr: 1.0e-3
  base_lr: 2.0e-4
  backbone_lr_multiplier: 1.0
  llrd_decay: 0.75
  freeze_backbone_epochs: 20
  warmup_epochs: 5
  warmup_start_lr: 1.0e-6
  min_lr: 1.0e-6
  backbone_warmup_epochs: 5
mlflow:
  run_name: fm_dinov3sat_l_rgb
