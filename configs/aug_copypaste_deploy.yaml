# Augmentation family (F): copy-paste screen on the locked v2 deploy recipe.
# Adds RTS-instance copy-paste (the top rare-object lever, ~1,513 positives) on top of
# deploy_v1_ndvi. Single-seed screen vs the deploy 3-seed (~0.915); if it clears the gate
# (mean Δ≥G AND sign-consistent + precision guard), seed-confirm before folding into v2.
base: base_v2_fast.yaml
seed: 42
data:
  data_root: /outputs/v1.0/data_local
  normalization_stats_path: /outputs/v1.0/staging/v1_splits/normalization_stats_ndvi.json
channels:
  rgb: true
  extra:
    - {name: ndvi, band: 0}
loss:
  boundary_handling: ignore
  boundary_ignore_width: 2
augmentation:
  multi_scale: {p: 0.0}
  mixing:
    copy_paste: {p: 0.5, max_instances: 3, blend_sigma: 2.0}
mlflow:
  run_name: aug_copypaste_deploy
