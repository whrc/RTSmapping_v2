# AUTO-FLATTENED from configs/fm_dinov3sat_l_ndvi_locked.yaml (the family-E fair recipe = 0.9191).
# Self-contained base for the v2.1 arm-(c) seed configs — the config loader forbids chained bases,
# so this holds the full merged recipe; the seed files add only {seed, encoder_init, run_name}.
# Regenerate if the locked recipe ever changes (it should not — v2.0 is frozen).
seed: 42
deterministic: false
data:
  version: '1.0'
  data_root: /outputs/v1.0/data_local
  rgb_dir: PLANET-RGB
  extra_dir: EXTRA
  labels_dir: labels
  metadata_csv: metadata.csv
  splits_yaml: splits.yaml
  splits_summary_json: splits_summary.json
  tile_size: 512
  crs: EPSG:3857
  label_ignore_index: 255
  normalization_stats_path: /outputs/v1.0/staging/v1_splits/normalization_stats_dinov3sat_ndvi.json
channels:
  rgb: true
  extra:
  - name: ndvi
    band: 0
splits:
  regions_geojson: gs://rts-mapping-v2/training/v1.0/circumpolar_subregions.geojson
  train_fraction: 0.8
  val_fraction: 0.1
  test_fraction: 0.1
  min_test_positives: 100
  min_val_ecoregions: 2
  min_train_positive_fraction: 0.7
  max_drift: 0.1
normalization:
  rgb_clip_percentiles:
  - 0.1
  - 99.9
  extra_clip_percentiles:
  - 0.1
  - 99.9
sampling:
  balanced: true
  positive_fraction: 0.5
  curriculum_schedule:
    1-10: 1
    11-30: 5
    31-50: 10
    51-100: 15
    101-300: 20
augmentation:
  geometric:
    rot90_p: 0.5
    hflip_p: 0.5
    vflip_p: 0.5
    shift_scale_rotate:
      shift: 0.1
      scale: 0.2
      rotate: 45
      p: 0.5
    elastic:
      alpha: 120
      sigma: 6
      p: 0.3
    shear:
      shear_degrees: 10
      p: 0.3
  color:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    brightness_contrast_p: 0.5
    gaussian_noise:
      var_limit:
      - 10
      - 50
      p: 0.3
    clahe:
      clip_limit: 4.0
      tile_grid:
      - 8
      - 8
      p: 0.2
  multi_scale:
    scale_range:
    - 0.5
    - 1.0
    p: 0.0
  auto_policy:
    mode: trivialaugment
    magnitude: 1.0
loss:
  function: focal
  focal_gamma: 2.0
  focal_alpha: 0.25
  lambda_focal: 1.0
  lambda_dice: 1.0
  tversky_alpha: 0.3
  tversky_beta: 0.7
  tversky_eps: 1.0
  dice_eps: 1.0
  boundary_handling: ignore
  boundary_ignore_width: 2
  soft_label_value: 0.05
training:
  batch_size: 16
  max_epochs: 300
  val_frequency: 5
  early_stopping:
    patience: 8
    min_delta: 0.005
    start_epoch: 65                  # was 101 — locked-recipe peaks land ep35-40 (max 40); 65 = safe margin, no LR-schedule change (max_epochs stays 300)
    metric: val_realistic_pr_auc_geomean
    smoothing_window: 3
  precision: bf16
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: true
  drop_last: true
  prewarm: false
  gcsfuse:
    file_cache_capacity_mb: 20480
    stat_cache_ttl: 24h
    type_cache_ttl: 24h
    file_cache_cache_file_for_range_read: true
    metadata_prefetch_on_mount: async
optimizer:
  name: adamw
  weight_decay: 0.05
  gradient_clip_norm: 1.0
lr_schedule:
  frozen_lr: 0.001
  base_lr: 0.0002
  backbone_lr_multiplier: 1.0
  freeze_backbone_epochs: 20
  scheduler: warmup_cosine
  warmup_epochs: 5
  warmup_start_lr: 1.0e-06
  min_lr: 1.0e-06
  backbone_warmup_epochs: 5
  llrd_decay: 0.75
ema:
  enabled: true
  decay: 0.999
model:
  architecture: foundation
  backbone: vit_large_patch16_dinov3.sat493m
  pretrained: true
  output_bias_prior: 0.005
metrics:
  min_blob_size_px: 10
  object_iou_threshold: 0.3
  reporting_threshold: 0.5
  pr_auc_ratios:
  - 5
  - 10
  - 20
  preview_tile_config: configs/preview_tiles.yaml
mlflow:
  tracking_uri: file:///outputs/mlflow
  experiment_name: rts-segmentation-v2.1
  run_name: fm_dinov3sat_l_ndvi_locked
