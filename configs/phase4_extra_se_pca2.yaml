# Phase 4 EXTRA channel ablation — SE_PCA **band 3 only** (se_pca_2), the PC2-alone arm.
# The SE_PCA group was only ever trained as an atomic 3-band pack (0.8736/0.8571, below
# NDVI-alone 0.8985). But the 8-band QC shows SE_PCA2 is the one SE band that tracks NDVI
# (Spearman -0.765 all / -0.66 positive / -0.702 boundary) while PC1/PC3 are near-inert
# (+0.47 / +0.04) — consistent with "PC2 carried the signal, PC1+PC3 diluted it". Untested
# until now because no config isolated a single PC.
#
# Identical to phase4_extra_se_pca.yaml except channels.extra + the stats file, so the
# comparison to the pack is controlled on everything else (same phase0c base, same split,
# boundary held at baseline `none`). Stats are sliced from the canonical 8-band
# normalization_stats.json, so the constants are bit-identical to the pack arm's.
#
# NOTE on PCA basis: band 3 is PC2 of the *production* basis (scripts/build_se_artifacts.py,
# SVD over training tiles). The visualization basis in plots/extra_channel_vis/ is a
# different fit and puts the NDVI correlation on PC1 — do not cite it about this run.
base: phase0c_seed42.yaml
data:
  data_root: /outputs/v1.0/data_local
  normalization_stats_path: /outputs/v1.0/staging/v1_splits/normalization_stats_se_pca2.json
channels:
  rgb: true
  extra:
    - {name: se_pca_2, band: 3}
mlflow:
  run_name: phase4_extra_se_pca2
