# Phase 0c — Multi-seed baseline, seed 42.
# Full 300-epoch run with locked normalization (Phase 0a winner) and LRs (Phase 0b winner).
# Three seeds (42, 43, 44) → measure μ₀ and σ₀ → calibrate gate G for all later phases.
#
# Phase 0a winner: Arm A (per-dataset z-score). Phase 0b: frozen_lr=3e-3, base_lr=TBD.
#
# Run: docker run --rm --gpus '"device=0"' --privileged \
#        -v /mnt/outputs:/outputs \
#        -e GOOGLE_APPLICATION_CREDENTIALS=/app/gcp_key.json \
#        rts-train:v2 \
#        scripts/train.py --config configs/phase0c_seed42.yaml

seed: 42
deterministic: false   # set true only for final multi-seed lock run

data:
  version: "2.0"
  data_root: "gs://abrupt_thaw/RTS_MODEL_V2/DATA/TRAINING_DATA"
  rgb_dir: "PLANET-RGB"
  extra_dir: "EXTRA"
  labels_dir: "labels"
  metadata_csv: "metadata_phase0c.csv"   # frozen 15,528-tile snapshot (2026-06-04); bucket may grow with new negatives mid-experiment
  splits_yaml: "splits_phase0c.yaml"      # frozen region assignment — keeps all 3 seeds on one immutable dataset
  splits_summary_json: "splits_summary.json"
  tile_size: 512
  crs: "EPSG:3857"
  label_ignore_index: 255
  normalization_stats_path: "gs://abrupt_thaw/RTS_MODEL_V2/DATA/TRAINING_DATA/normalization_stats.json"

channels:
  rgb: true
  extra: []

splits:
  regions_geojson: "gs://abrupt_thaw/RTS_MODEL_V2/DATA/circumpolar_subregions.geojson"
  train_fraction: 0.80
  val_fraction: 0.10
  test_fraction: 0.10
  min_test_positives: 100
  min_val_ecoregions: 2
  min_train_positive_fraction: 0.70
  max_drift: 0.10

normalization:
  rgb_clip_percentiles: [0.1, 99.9]
  extra_clip_percentiles: [0.1, 99.9]

sampling:
  balanced: true
  positive_fraction: 0.5
  curriculum_schedule:
    "1-10":     1
    "11-30":    5
    "31-50":   10
    "51-100":  15
    "101-300": 20

augmentation:
  geometric:
    rot90_p: 0.5
    hflip_p: 0.5
    vflip_p: 0.5
    shift_scale_rotate:
      shift: 0.1
      scale: 0.2
      rotate: 45
      p: 0.5
    elastic:
      alpha: 120
      sigma: 6
      p: 0.3
    shear:
      shear_degrees: 10
      p: 0.3
  color:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    brightness_contrast_p: 0.5
    gaussian_noise:
      var_limit: [10, 50]
      p: 0.3
    clahe:
      clip_limit: 4.0
      tile_grid: [8, 8]
      p: 0.2
  multi_scale:
    scale_range: [0.5, 1.0]
    p: 0.3

loss:
  function: "tversky"
  focal_gamma: 2.0
  focal_alpha: 0.25
  lambda_focal: 1.0
  lambda_dice: 1.0
  tversky_alpha: 0.3
  tversky_beta: 0.7
  tversky_eps: 1.0
  dice_eps: 1.0
  boundary_handling: "none"
  boundary_ignore_width: 3
  soft_label_value: 0.05

training:
  batch_size: 32
  max_epochs: 300
  val_frequency: 5
  early_stopping:
    patience: 8
    min_delta: 0.005
    start_epoch: 101
    metric: "val_realistic_pr_auc_geomean"
    smoothing_window: 3
  precision: "bf16"
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: true
  drop_last: true
  prewarm: false   # only enable when gcsfuse is mounted; without it reads hit GCS with no cache benefit
  gcsfuse:
    file_cache_capacity_mb: 20480
    stat_cache_ttl: "24h"
    type_cache_ttl: "24h"
    file_cache_cache_file_for_range_read: true
    metadata_prefetch_on_mount: "async"

optimizer:
  name: "adamw"
  weight_decay: 1.0e-2
  gradient_clip_norm: 1.0

lr_schedule:
  frozen_lr: 3.0e-3   # phase0b frozen: steepest descent zone 2.4e-3–4.1e-3, divergence 1e-1
  base_lr: 1.0e-3    # phase0b unfrozen: steepest descent 1.4e-3–4.1e-3, divergence 5.9e-2; backbone gets 1e-4
  backbone_lr_multiplier: 0.1
  freeze_backbone_epochs: 10
  scheduler: "warmup_cosine"
  warmup_epochs: 5
  warmup_start_lr: 1.0e-6
  min_lr: 1.0e-6
  backbone_warmup_epochs: 3

ema:
  enabled: true
  decay: 0.999

model:
  architecture: "unetplusplus"
  backbone: "efficientnet-b5"
  pretrained: true
  output_bias_prior: 0.005

metrics:
  min_blob_size_px: 10
  object_iou_threshold: 0.3
  reporting_threshold: 0.5
  # Gate metric = geomean(PR-AUC @ these ratios). Negative pool ceiling ~16k
  # → val honestly supports up to ~1:10-20; 1:200/1:1000 are unreachable without
  # bootstrap (see docs/baseline_unetpp_effb5.md). Gate on honest ratios; pixel_iou
  # and obj_f1 are logged as stability anchors.
  pr_auc_ratios: [5, 10, 20]
  preview_tile_config: "configs/preview_tiles.yaml"

mlflow:
  tracking_uri: "file:///outputs/mlflow"  # local file store inside Docker; MLflow 2.x+ does not support gs:// as tracking (only artifact) URI
  experiment_name: "rts-segmentation-v2"
  run_name: "abl_loss_tversky"
