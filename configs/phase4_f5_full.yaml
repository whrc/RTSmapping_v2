# Heavy fusion F5 — residual cross-modal attention (JSTARS-style) 
# on the full 8-band stack. Tests whether a separate EXTRA encoder extracts signal that
# early fusion (F0 0.876) / stem-init (F1 0.890) / chan-attn (F2 0.827) leave on the table.
# base_v2_fast (gate-neutral); boundary none + pf0.5 (matches the F0/F1/F2 fusion track).
base: base_v2_fast.yaml
seed: 42
data:
  data_root: /outputs/v1.0/data_local
  normalization_stats_path: /outputs/v1.0/staging/v1_splits/normalization_stats.json
model:
  fusion: cross_modal
channels:
  rgb: true
  extra:
    - {name: ndvi,     band: 0}
    - {name: nbr,      band: 1}
    - {name: se_pca_1, band: 2}
    - {name: se_pca_2, band: 3}
    - {name: se_pca_3, band: 4}
    - {name: se_proto, band: 5}
    - {name: tc_1,     band: 6}
    - {name: tc_2,     band: 7}
mlflow:
  run_name: phase4_f5_full
