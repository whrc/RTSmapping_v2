# Phase 4 EXTRA channel ablation — NDVI + SE_PCA3 (the a-priori best complement arm).
# Companion to phase4_extra_ndvi_sepca2.yaml. PC3 is the most independent band in the whole
# 8-band stack (dendrogram joins at 0.88; Spearman vs NDVI = +0.04 all / -0.07 positive),
# so on information grounds it is the better bet to add something NDVI does not already
# carry — whereas PC2 (r=-0.765 vs NDVI) is largely a sign-flipped NDVI.
#
# Costs one extra run and makes the pair diagnostic: if PC3 clears the gate over NDVI-alone
# (0.8985) while PC2 does not, the NDVI+pack null (0.900) is explained by dilution rather
# than by SE genuinely carrying nothing.
#
# Identical to phase4_extra_ndvi_sepca.yaml except channels.extra + the stats file (sliced
# from the canonical 8-band normalization_stats.json → constants bit-identical to that arm).
base: phase0c_seed42.yaml
data:
  data_root: /outputs/v1.0/data_local
  normalization_stats_path: /outputs/v1.0/staging/v1_splits/normalization_stats_ndvi_sepca3.json
channels:
  rgb: true
  extra:
    - {name: ndvi, band: 0}
    - {name: se_pca_3, band: 4}
mlflow:
  run_name: phase4_extra_ndvi_sepca3
