# Architecture family (E): EffB3 capacity-DOWN probe on the locked v2 deploy recipe.
# Identical to deploy_v1_ndvi_seed42 except backbone efficientnet-b5 -> efficientnet-b3.
# On a well-fit plateau the principled capacity move is DOWN (B3 as a regularizer), not up.
# Gate best_smoothed vs the EffB5 deploy 3-seed (~0.915): confirms EffB5 or yields a cheaper deploy.
base: base_v2_fast.yaml
seed: 42
data:
  data_root: /outputs/v1.0/data_local
  normalization_stats_path: /outputs/v1.0/staging/v1_splits/normalization_stats_ndvi.json
channels:
  rgb: true
  extra:
    - {name: ndvi, band: 0}
loss:
  boundary_handling: ignore
  boundary_ignore_width: 2
augmentation:
  multi_scale: {p: 0.0}
model:
  backbone: efficientnet-b3
mlflow:
  run_name: effb3_deploy
