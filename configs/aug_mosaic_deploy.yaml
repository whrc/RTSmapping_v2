# Augmentation family (F): mosaic screen on the locked v2 deploy recipe (single-seed vs deploy 3-seed).
base: base_v2_fast.yaml
seed: 42
data:
  data_root: /outputs/v1.0/data_local
  normalization_stats_path: /outputs/v1.0/staging/v1_splits/normalization_stats_ndvi.json
channels:
  rgb: true
  extra:
    - {name: ndvi, band: 0}
loss:
  boundary_handling: ignore
  boundary_ignore_width: 2
augmentation:
  multi_scale: {p: 0.0}
  mixing:
    mosaic: {p: 0.5}
mlflow:
  run_name: aug_mosaic_deploy
